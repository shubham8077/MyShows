<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

// ─── CONFIG ───────────────────────────────────────────────────────────────────
const API_BASE = 'http://localhost:5000/api';
const JIKAN = 'https://api.jikan.moe/v4';
const TVMAZE = 'https://api.tvmaze.com';



// ─── BOOKMARK CONTEXT ─────────────────────────────────────────────────────────
const BookmarkCtx = createContext();

function BookmarkProvider({children}) {
  const [bookmarks, setBookmarks] = useState([]);
  const [bookmarkIds, setBookmarkIds] = useState(new Set());
  const [loading, setLoading] = useState(false);
  const [toast, setToast] = useState(null);
  const [apiOnline, setApiOnline] = useState(true);

  const showToast = (message, type='success') => {
    setToast({message, type});
    setTimeout(()=>setToast(null), 3000);
  };

  const loadBookmarks = useCallback(async () => {
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/bookmarks`);
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      if (data.success) {
        setBookmarks(data.data);
        setBookmarkIds(new Set(data.data.map(b=>b.showId)));
        setApiOnline(true);
      } else {
        throw new Error('API success false');
      }
    } catch (err) {
      console.error("loadBookmarks offline fallback triggered:", err);
      setApiOnline(false);
      // Load from localStorage fallback
      try {
        const saved = JSON.parse(localStorage.getItem('myshows_bookmarks') || '[]');
        setBookmarks(saved);
        setBookmarkIds(new Set(saved.map(b=>b.showId)));
      } catch (e) {
        console.error("localStorage parse error:", e);
      }
    } finally {
      setLoading(false);
    }
  }, []);

  const saveLocal = (list) => {
    localStorage.setItem('myshows_bookmarks', JSON.stringify(list));
  };

  const addToBookmarks = useCallback(async (show, status='wishlist') => {
    if (bookmarkIds.has(show.id)) { showToast('Already in your list!','warning'); return false; }
    const entry = {showId:show.id, title:show.title, poster:show.poster, genre:show.genre, description:show.description, category:show.category, status, rating:null, createdAt:new Date().toISOString()};
    try {
      const res = await fetch(`${API_BASE}/bookmarks`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entry)});
      if (!res.ok) throw new Error('API error');
      const data = await res.json();
      if (data.success) {
        const updated = [data.data, ...bookmarks];
        setBookmarks(updated);
        setBookmarkIds(new Set([...bookmarkIds, show.id]));
        showToast(`"${show.title}" added to ${status}!`);
        return true;
      }
      throw new Error('API success false');
    } catch (err) {
      console.error("addToBookmarks offline fallback triggered:", err);
      try {
        // Fallback
        const updated = [entry, ...bookmarks];
        setBookmarks(updated);
        setBookmarkIds(new Set([...bookmarkIds, show.id]));
        saveLocal(updated);
        showToast(`"${show.title}" added (offline mode)`);
        console.log("Offline mode add successful");
      } catch (innerErr) {
        console.error("Error inside addToBookmarks catch block:", innerErr);
      }
      return true;
    }
    return false;
  }, [bookmarks, bookmarkIds]);

  const updateStatus = useCallback(async (showId, status) => {
    try {
      const res = await fetch(`${API_BASE}/bookmarks/${showId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})});
      if (!res.ok) throw new Error('API error');
    } catch {}
    const updated = bookmarks.map(b => b.showId===showId ? {...b, status} : b);
    setBookmarks(updated);
    saveLocal(updated);
    showToast(`Moved to ${status}!`);
  }, [bookmarks]);

  const updateRating = useCallback(async (showId, rating) => {
    try {
      const res = await fetch(`${API_BASE}/bookmarks/${showId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({rating})});
      if (!res.ok) throw new Error('API error');
    } catch {}
    const updated = bookmarks.map(b => b.showId===showId ? {...b, rating} : b);
    setBookmarks(updated);
    saveLocal(updated);
  }, [bookmarks]);

  const removeFromBookmarks = useCallback(async (showId, title) => {
    try {
      const res = await fetch(`${API_BASE}/bookmarks/${showId}`, {method:'DELETE'});
      if (!res.ok) throw new Error('API error');
    } catch {}
    const updated = bookmarks.filter(b => b.showId!==showId);
    setBookmarks(updated);
    const newIds = new Set(bookmarkIds); newIds.delete(showId);
    setBookmarkIds(newIds);
    saveLocal(updated);
    showToast(`"${title}" removed`);
  }, [bookmarks, bookmarkIds]);

  const isBookmarked = useCallback((id) => bookmarkIds.has(id), [bookmarkIds]);

  useEffect(() => { loadBookmarks(); }, [loadBookmarks]);

  return (
    <BookmarkCtx.Provider value={{bookmarks, loading, toast, apiOnline, loadBookmarks, addToBookmarks, updateStatus, updateRating, removeFromBookmarks, isBookmarked, bookmarkIds}}>
      {children}
    </BookmarkCtx.Provider>
  );
}
const useBookmarks = () => useContext(BookmarkCtx);

// ─── TOAST ────────────────────────────────────────────────────────────────────
function Toast({toast}) {
  if (!toast) return null;
  const styles = {success:{bg:'#e8c547',fg:'#090b10',icon:'✓'}, error:{bg:'#ef4444',fg:'#fff',icon:'✕'}, warning:{bg:'#f59e0b',fg:'#090b10',icon:'⚠'}};
  const s = styles[toast.type]||styles.success;
  return (
    <div className="fixed bottom-5 right-5 z-50 fade-in flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl"
      style={{background:s.bg, color:s.fg, minWidth:'220px'}}>
      <span className="w-6 h-6 rounded-full flex items-center justify-center font-bold text-sm flex-shrink-0"
        style={{background:'rgba(0,0,0,0.15)'}}>{s.icon}</span>
      <span className="text-sm font-medium">{toast.message}</span>
    </div>
  );
}

// ─── STAR RATING ──────────────────────────────────────────────────────────────
function StarRating({rating, onRate}) {
  const [hov, setHov] = useState(0);
  return (
    <div className="flex gap-0.5">
      {[1,2,3,4,5].map(s=>(
        <button key={s} onClick={()=>onRate(s)} onMouseEnter={()=>setHov(s)} onMouseLeave={()=>setHov(0)}
          className="text-lg transition-transform hover:scale-125" style={{color:s<=(hov||rating)?'#e8c547':'#2d3748',lineHeight:1}}>★</button>
      ))}
    </div>
  );
}

// ─── SHOW CARD ────────────────────────────────────────────────────────────────
const CAT_BADGE = {kdrama:'bg-pink-500/20 text-pink-300',cdrama:'bg-red-500/20 text-red-300',anime:'bg-purple-500/20 text-purple-300',tvshow:'bg-blue-500/20 text-blue-300'};
const CAT_LABEL = {kdrama:'🇰🇷 K-Drama',cdrama:'🇨🇳 C-Drama',anime:'🎌 Anime',tvshow:'📺 TV Show'};
const STATUS_COLOR = {wishlist:{bg:'#fbbf2420',fg:'#fbbf24'},watching:{bg:'#60a5fa20',fg:'#60a5fa'},watched:{bg:'#34d39920',fg:'#34d399'}};

function ShowCard({show, delay=0}) {
  const {addToBookmarks, removeFromBookmarks, isBookmarked, bookmarks} = useBookmarks();
  const [menu, setMenu] = useState(false);
  const [imgErr, setImgErr] = useState(false);
  const booked = isBookmarked(show.id);
  const bData = bookmarks.find(b=>b.showId===show.id);

  const handleAdd = async (e, status) => {
    e.stopPropagation(); setMenu(false);
    if (booked) await removeFromBookmarks(show.id, show.title);
    else await addToBookmarks(show, status);
  };

  return (
    <div className="relative card-hover fade-in" style={{animationDelay:`${delay}ms`}} onMouseLeave={()=>setMenu(false)}>
      <div className="rounded-xl overflow-hidden" style={{background:'#161b26',border:'1px solid #1e2534'}}>
        {/* Poster area */}
        <div className="relative group" style={{aspectRatio:'2/3',overflow:'hidden',background:'#0f1117'}}>
          {!imgErr && show.poster
            ? <img src={show.poster} alt={show.title} style={{width:'100%',height:'100%',objectFit:'cover',transition:'transform 0.5s ease'}}
                className="group-hover:scale-110" onError={()=>setImgErr(true)}/>
            : <div className="w-full h-full flex flex-col items-center justify-center gap-2" style={{background:'linear-gradient(135deg,#161b26,#0f1117)'}}>
                <div style={{fontSize:'2.5rem'}}>{show.category==='anime'?'🎌':show.category==='kdrama'?'🇰🇷':show.category==='cdrama'?'🇨🇳':'📺'}</div>
                <p className="text-xs text-center px-2 line2" style={{color:'#4a5568'}}>{show.title}</p>
              </div>
          }
          {/* Hover overlay */}
          <div className="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end"
            style={{background:'linear-gradient(to top,rgba(9,11,16,0.95) 55%,transparent)'}}>
            <p className="p-3 text-xs line3" style={{color:'#a0aec0'}}>{show.description||'No description.'}</p>
          </div>
          {/* Category badge */}
          <div className="absolute top-2 left-2">
            <span className={`text-xs px-2 py-0.5 rounded-full ${CAT_BADGE[show.category]}`} style={{fontSize:'10px',border:'1px solid rgba(255,255,255,0.1)'}}>
              {CAT_LABEL[show.category]}
            </span>
          </div>
          {/* Bookmark btn */}
          <div className="absolute top-2 right-2 z-50">
            <button onClick={e=>{e.stopPropagation(); booked?handleAdd(e,null):setMenu(m=>!m)}}
              className="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-200"
              style={booked?{background:'#e8c547',color:'#090b10'}:{background:'rgba(0,0,0,0.65)',color:'#fff'}}>
              {booked?'✓':'+'}
            </button>
            {menu && !booked && (
              <div className="absolute right-0 top-10 rounded-xl overflow-hidden shadow-2xl z-50 w-36"
                style={{background:'#161b26',border:'1px solid #1e2534'}}>
                {[['wishlist','🔖 Wishlist'],['watching','▶️ Watching'],['watched','✅ Watched']].map(([s,l])=>(
                  <button key={s} onClick={e=>handleAdd(e,s)}
                    className="w-full text-left px-4 py-2.5 text-xs hover:bg-white/5 transition-colors"
                    style={{color:'#e2e8f0'}}>{l}</button>
                ))}
              </div>
            )}
          </div>
          {/* Status badge */}
          {booked && bData && (
            <div className="absolute bottom-2 right-2">
              <span className="text-xs px-2 py-0.5 rounded-full font-semibold"
                style={{background:STATUS_COLOR[bData.status]?.fg||'#e8c547',color:'#090b10',fontSize:'10px'}}>
                {bData.status==='wishlist'?'🔖':bData.status==='watching'?'▶️':'✅'} {bData.status}
              </span>
            </div>
          )}
        </div>
        {/* Info */}
        <div className="p-3">
          <h3 className="font-semibold text-sm leading-tight line2 mb-1" style={{color:'#e2e8f0'}}>{show.title}</h3>
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-2">
              {show.rating && <span className="text-xs font-medium" style={{color:'#e8c547'}}>★ {typeof show.rating==='number'?show.rating.toFixed(1):show.rating}</span>}
              {show.year && <span className="text-xs" style={{color:'#4a5568'}}>{show.year}</span>}
            </div>
            {show.episodes && <span className="text-xs" style={{color:'#4a5568'}}>{show.episodes} eps</span>}
          </div>
          {show.genre?.length>0 && (
            <div className="flex flex-wrap gap-1 mt-1.5">
              {show.genre.slice(0,2).map(g=>(
                <span key={g} className="text-xs px-1.5 py-0.5 rounded" style={{background:'#1e2534',color:'#718096',fontSize:'10px'}}>{g}</span>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── BOOKMARK CARD ────────────────────────────────────────────────────────────
function BookmarkCard({bookmark}) {
  const {updateStatus, updateRating, removeFromBookmarks} = useBookmarks();
  const [imgErr, setImgErr] = useState(false);
  const [statusMenu, setStatusMenu] = useState(false);
  const sc = STATUS_COLOR[bookmark.status]||STATUS_COLOR.wishlist;
  const statusIcon = {wishlist:'🔖',watching:'▶️',watched:'✅'};

  return (
    <div className="flex gap-3 rounded-xl p-3 fade-in transition-all hover:border-white/10"
      style={{background:'#161b26',border:'1px solid #1e2534'}} onMouseLeave={()=>setStatusMenu(false)}>
      <div className="flex-shrink-0 rounded-lg overflow-hidden" style={{width:'66px',height:'99px',background:'#0f1117'}}>
        {!imgErr&&bookmark.poster
          ? <img src={bookmark.poster} alt={bookmark.title} style={{width:'100%',height:'100%',objectFit:'cover'}} onError={()=>setImgErr(true)}/>
          : <div className="w-full h-full flex items-center justify-center text-2xl">
              {bookmark.category==='anime'?'🎌':bookmark.category==='kdrama'?'🇰🇷':bookmark.category==='cdrama'?'🇨🇳':'📺'}
            </div>}
      </div>
      <div className="flex-1 min-w-0">
        <div className="flex items-start justify-between gap-2 mb-1">
          <h4 className="font-semibold text-sm line2 leading-snug" style={{color:'#e2e8f0'}}>{bookmark.title}</h4>
          <button onClick={()=>removeFromBookmarks(bookmark.showId,bookmark.title)}
            className="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs transition-colors hover:bg-red-500/20"
            style={{color:'#4a5568'}}>✕</button>
        </div>
        <div className="flex flex-wrap gap-1 mb-1">
          {bookmark.genre?.slice(0,2).map(g=>(
            <span key={g} className="text-xs px-1.5 py-0.5 rounded" style={{background:'#1e2534',color:'#718096',fontSize:'10px'}}>{g}</span>
          ))}
        </div>
        <p className="text-xs line2 mb-2" style={{color:'#4a5568'}}>{bookmark.description||''}</p>
        <div className="flex items-center justify-between flex-wrap gap-2">
          {/* Status picker */}
          <div className="relative">
            <button onClick={()=>setStatusMenu(m=>!m)}
              className="flex items-center gap-1 text-xs px-2.5 py-1 rounded-full transition-colors"
              style={{background:sc.bg,color:sc.fg,border:`1px solid ${sc.fg}30`}}>
              {statusIcon[bookmark.status]} {bookmark.status} <span style={{fontSize:'8px',marginLeft:'2px'}}>▼</span>
            </button>
            {statusMenu && (
              <div className="absolute left-0 bottom-9 z-50 rounded-xl overflow-hidden shadow-2xl w-36"
                style={{background:'#161b26',border:'1px solid #1e2534'}}>
                {['wishlist','watching','watched'].filter(s=>s!==bookmark.status).map(s=>{
                  const c=STATUS_COLOR[s];
                  return <button key={s} onClick={()=>{updateStatus(bookmark.showId,s);setStatusMenu(false)}}
                    className="w-full text-left px-4 py-2.5 text-xs hover:bg-white/5 transition-colors flex items-center gap-2"
                    style={{color:c.fg}}>
                    {statusIcon[s]} {s}
                  </button>;
                })}
              </div>
            )}
          </div>
          <StarRating rating={bookmark.rating} onRate={r=>updateRating(bookmark.showId,r)}/>
        </div>
      </div>
    </div>
  );
}

    <div className="rounded-xl overflow-hidden" style={{background:'#161b26',border:'1px solid #1e2534'}}>
      <div className="shimmer" style={{aspectRatio:'2/3'}}/>
      <div className="p-3 space-y-2">
        <div className="shimmer h-4 rounded"/><div className="shimmer h-3 rounded w-2/3"/>
      </div>

// ─── DISCOVER PAGE ────────────────────────────────────────────────────────────
const CATS = [{id:'all',label:'All Shows',icon:'🌟'},{id:'kdrama',label:'K-Drama',icon:'🇰🇷'},{id:'cdrama',label:'C-Drama',icon:'🇨🇳'},{id:'anime',label:'Anime',icon:'🎌'},{id:'tvshow',label:'TV Shows',icon:'📺'}];
const SORTS = [{v:'default',l:'Default'},{v:'title_asc',l:'A→Z'},{v:'title_desc',l:'Z→A'},{v:'rating_desc',l:'Rating ↓'},{v:'rating_asc',l:'Rating ↑'},{v:'year_desc',l:'Newest'},{v:'year_asc',l:'Oldest'}];

function sortArr(arr, s) {
  const a=[...arr];
  if(s==='title_asc') return a.sort((x,y)=>(x.title||'').localeCompare(y.title||''));
  if(s==='title_desc') return a.sort((x,y)=>(y.title||'').localeCompare(x.title||''));
  if(s==='rating_desc') return a.sort((x,y)=>(y.rating||0)-(x.rating||0));
  if(s==='rating_asc') return a.sort((x,y)=>(x.rating||0)-(y.rating||0));
  if(s==='year_desc') return a.sort((x,y)=>(y.year||0)-(x.year||0));
  if(s==='year_asc') return a.sort((x,y)=>(x.year||0)-(y.year||0));
  return a;
}

function DiscoverPage() {
  const [cat, setCat] = useState('all');
  const [shows, setShows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [query, setQuery] = useState('');
  const [inputVal, setInputVal] = useState('');
  const [sort, setSort] = useState('default');
  const [genre, setGenre] = useState('');
  const [page, setPage] = useState(1);
  const timer = useRef(null);

  const loadShows = useCallback(async (category, q, pageNum) => {
    setLoading(true);
    let results = [];
    
    const jikanLimit = category === 'all' ? 10 : 20;
    const tvLimit = category === 'all' ? 10 : 20;
    
    // Anime from Jikan
    if(category==='all'||category==='anime') {
      try {
        const url = q ? `${JIKAN}/anime?q=${encodeURIComponent(q)}&page=${pageNum}&limit=${jikanLimit}` : `${JIKAN}/top/anime?page=${pageNum}&limit=${jikanLimit}`;
        const r = await fetch(url); const d = await r.json();
        results.push(...(d.data||[]).map(a=>({id:`anime_${a.mal_id}`,title:a.title_english||a.title,poster:a.images?.jpg?.large_image_url||a.images?.jpg?.image_url,genre:a.genres?.map(g=>g.name).slice(0,3)||[],description:(a.synopsis||'').replace('[Written by MAL Rewrite]','').trim(),rating:a.score,year:a.year||(a.aired?.from?new Date(a.aired.from).getFullYear():null),episodes:a.episodes,category:'anime'})));
      } catch {}
    }

    // TV, KDrama, CDrama from TVMaze
    if(category==='all'||category==='tvshow'||category==='kdrama'||category==='cdrama') {
      try {
        let list = [];
        if (q) {
           const r = await fetch(`${TVMAZE}/search/shows?q=${encodeURIComponent(q)}`);
           const d = await r.json();
           list = d.map(item => item.show);
        } else {
           if (category === 'kdrama') {
             const queries = ['korean', 'korea', 'seoul', 'kdrama', 'romance', 'thriller', 'action', 'mystery', 'crime', 'comedy', 'fantasy', 'sbs', 'kbs', 'mbc', 'tvn'];
             const reqs = queries.map(q => fetch(`${TVMAZE}/search/shows?q=${q}`).then(r => r.json()).catch(()=>[]));
             const res = await Promise.all(reqs);
             const combined = res.flat().map(item => item.show);
             const uniqueIds = new Set();
             list = combined.filter(s => {
                if (!s || uniqueIds.has(s.id)) return false;
                uniqueIds.add(s.id);
                return s.language === 'Korean' || s.network?.country?.code === 'KR' || s.webChannel?.country?.code === 'KR';
             });
           } else if (category === 'cdrama') {
             const queries = ['chinese', 'china', 'cdrama', 'wuxia', 'xianxia', 'tencent', 'iqiyi', 'youku', 'mango'];
             const reqs = queries.map(q => fetch(`${TVMAZE}/search/shows?q=${q}`).then(r => r.json()).catch(()=>[]));
             const res = await Promise.all(reqs);
             const combined = res.flat().map(item => item.show);
             const uniqueIds = new Set();
             list = combined.filter(s => {
                if (!s || uniqueIds.has(s.id)) return false;
                uniqueIds.add(s.id);
                return s.language === 'Chinese' || s.network?.country?.code === 'CN' || s.webChannel?.country?.code === 'CN';
             });
           } else {
             const tvmazePage = Math.floor((pageNum - 1) * tvLimit / 250);
             const r = await fetch(`${TVMAZE}/shows?page=${tvmazePage}`);
             const d = await r.json();
             const startIndex = ((pageNum - 1) * tvLimit) % 250;
             list = d.slice(startIndex, startIndex + tvLimit);
           }
        }

        if (q || category === 'kdrama' || category === 'cdrama') {
             const startIndex = (pageNum - 1) * tvLimit;
             list = list.slice(startIndex, startIndex + tvLimit);
        }

        results.push(...list.map(s=>({
          id:`tv_${s.id}`,
          title:s.name,
          poster:s.image?.medium||null,
          genre:s.genres?.slice(0,3)||[],
          description:(s.summary||'').replace(/<[^>]+>/g,''),
          rating:s.rating?.average,
          year:s.premiered?new Date(s.premiered).getFullYear():null,
          episodes:null,
          category: s.language === 'Korean' ? 'kdrama' : (s.language === 'Chinese' ? 'cdrama' : 'tvshow')
        })));
      } catch (e) { console.error("TVMaze fetch error", e); }
    }
    
    if (category !== 'all') {
       results = results.filter(r => r.category === category);
    }

    setShows(results);
    setLoading(false);
  }, []);

  useEffect(()=>{ loadShows(cat, query, page); }, [cat, query, page, loadShows]);

  const onInput = v => {
    setInputVal(v);
    clearTimeout(timer.current);
    timer.current = setTimeout(()=>{setQuery(v); setPage(1);}, 500);
  };

  const allGenres = useMemo(()=>[...new Set(shows.flatMap(s=>s.genre||[]))].sort(),[shows]);
  const displayed = useMemo(()=>{
    let list = genre ? shows.filter(s=>s.genre?.includes(genre)) : shows;
    return sortArr(list, sort);
  },[shows,genre,sort]);

  return (
    <div style={{minHeight:'100vh'}}>
      {/* Hero */}
      <div className="relative overflow-hidden py-16 px-6 text-center" style={{background:'linear-gradient(160deg,#090b10 0%,#0f1117 60%,#090b10 100%)'}}>
        <div className="absolute inset-0 pointer-events-none" style={{background:'radial-gradient(ellipse 60% 50% at 20% 60%,rgba(232,197,71,0.06),transparent),radial-gradient(ellipse 50% 40% at 80% 40%,rgba(147,51,234,0.06),transparent)'}}/>
        <div className="relative">
          <div className="flex items-center justify-center gap-3 mb-3">
            <div className="h-px w-12" style={{background:'linear-gradient(to right,transparent,#e8c547)'}}/>
            <span className="text-xs tracking-widest uppercase" style={{color:'#e8c547'}}>Discover & Track</span>
            <div className="h-px w-12" style={{background:'linear-gradient(to left,transparent,#e8c547)'}}/>
          </div>
          <h1 className="font-display mb-3" style={{fontSize:'clamp(4rem,12vw,7.5rem)',color:'#e2e8f0',letterSpacing:'6px',lineHeight:1}}>
            MY<span style={{color:'#e8c547'}}>SHOWS</span>
          </h1>
          <p style={{color:'#718096',maxWidth:'340px',margin:'0 auto',fontSize:'0.9rem'}}>Your personal tracker for K-Dramas, C-Dramas, Anime & TV Series</p>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-4 py-8">
        {/* Controls */}
        <div className="flex flex-col md:flex-row gap-3 mb-5">
          <div className="relative flex-1">
            <span className="absolute left-3.5 top-1/2 -translate-y-1/2" style={{color:'#4a5568',fontSize:'1rem'}}>🔍</span>
            <input value={inputVal} onChange={e=>onInput(e.target.value)} placeholder="Search shows, anime, dramas…"
              className="w-full pl-10 pr-4 py-3 rounded-xl text-sm outline-none transition-all"
              style={{background:'#161b26',border:'1px solid #1e2534',color:'#e2e8f0'}}
              onFocus={e=>e.target.style.borderColor='#e8c547'} onBlur={e=>e.target.style.borderColor='#1e2534'}/>
          </div>
          <select value={sort} onChange={e=>setSort(e.target.value)} className="px-4 py-3 rounded-xl text-sm outline-none cursor-pointer" style={{background:'#161b26',border:'1px solid #1e2534',color:'#e2e8f0',minWidth:'130px'}}>
            {SORTS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
          </select>
          <select value={genre} onChange={e=>{setGenre(e.target.value);setPage(1);}} className="px-4 py-3 rounded-xl text-sm outline-none cursor-pointer" style={{background:'#161b26',border:'1px solid #1e2534',color:genre?'#e8c547':'#718096',minWidth:'130px'}}>
            <option value="">All Genres</option>
            {allGenres.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
        </div>

        {/* Category tabs */}
        <div className="flex gap-2 mb-7 overflow-x-auto pb-1">
          {CATS.map(c=>(
            <button key={c.id} onClick={()=>{setCat(c.id);setGenre('');setPage(1);}}
              className="flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-medium whitespace-nowrap transition-all duration-200 flex-shrink-0"
              style={cat===c.id?{background:'#e8c547',color:'#090b10',fontWeight:700}:{background:'#161b26',color:'#718096',border:'1px solid #1e2534'}}>
              {c.icon} {c.label}
            </button>
          ))}
        </div>

        {/* Count + clear */}
        {!loading && (
          <div className="flex items-center justify-between mb-4">
            <p className="text-xs" style={{color:'#4a5568'}}>{displayed.length} show{displayed.length!==1?'s':''}{genre?` · "${genre}"`:''}</p>
            {(genre||sort!=='default') && <button onClick={()=>{setGenre('');setSort('default');}} className="text-xs px-3 py-1 rounded-lg transition-colors hover:bg-white/5" style={{color:'#e8c547',border:'1px solid #e8c54730'}}>Clear filters</button>}
          </div>
        )}

        {/* Grid */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(155px,1fr))',gap:'1rem'}}>
          {loading
            ? Array.from({length:20}).map((_,i)=><Skeleton key={i}/>)
            : displayed.length>0
              ? displayed.map((s,i)=><ShowCard key={s.id} show={s} delay={Math.min(i*20,400)}/>)
              : <div style={{gridColumn:'1/-1'}} className="flex flex-col items-center py-24 gap-4">
                  <span style={{fontSize:'4rem'}}>🎭</span>
                  <p className="text-lg font-semibold" style={{color:'#e2e8f0'}}>No shows found</p>
                  <p className="text-sm" style={{color:'#4a5568'}}>Try different search or filters</p>
                </div>}
        </div>

        {/* Pagination */}
        {!loading && (
          <div className="flex items-center justify-center gap-4 mt-12 pb-8">
            <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1}
              className="px-6 py-2.5 rounded-xl text-sm font-medium transition-all"
              style={{background: page === 1 ? '#161b26' : '#e8c547', color: page === 1 ? '#4a5568' : '#090b10', cursor: page === 1 ? 'not-allowed' : 'pointer'}}>
              ← Previous
            </button>
            <span className="text-sm font-bold" style={{color:'#e2e8f0'}}>Page {page}</span>
            <button onClick={() => setPage(p => p + 1)} disabled={shows.length < (cat === 'all' ? 20 : 20)}
              className="px-6 py-2.5 rounded-xl text-sm font-medium transition-all"
              style={{background: shows.length < 20 ? '#161b26' : '#e8c547', color: shows.length < 20 ? '#4a5568' : '#090b10', cursor: shows.length < 20 ? 'not-allowed' : 'pointer'}}>
              Next →
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── MY LIST PAGE ─────────────────────────────────────────────────────────────
const STATUS_TABS = [{id:'all',l:'All',i:'📚'},{id:'wishlist',l:'Wishlist',i:'🔖'},{id:'watching',l:'Watching',i:'▶️'},{id:'watched',l:'Watched',i:'✅'}];
const CAT_FILTERS = [{id:'all',l:'All',i:'🌟'},{id:'kdrama',l:'K-Drama',i:'🇰🇷'},{id:'cdrama',l:'C-Drama',i:'🇨🇳'},{id:'anime',l:'Anime',i:'🎌'},{id:'tvshow',l:'TV Shows',i:'📺'}];
const LIST_SORTS = [{v:'newest',l:'Newest Added'},{v:'oldest',l:'Oldest Added'},{v:'title_asc',l:'Title A-Z'},{v:'title_desc',l:'Title Z-A'},{v:'rating_desc',l:'Rating ↓'},{v:'rating_asc',l:'Rating ↑'}];

function StatsBar({bookmarks}) {
  const s = useMemo(()=>{
    const total=bookmarks.length, watching=bookmarks.filter(b=>b.status==='watching').length, watched=bookmarks.filter(b=>b.status==='watched').length, wishlist=bookmarks.filter(b=>b.status==='wishlist').length;
    const rated=bookmarks.filter(b=>b.rating); const avg=rated.length?(rated.reduce((s,b)=>s+b.rating,0)/rated.length).toFixed(1):null;
    return {total,watching,watched,wishlist,avg};
  },[bookmarks]);
  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:'0.75rem',marginBottom:'2rem'}}>
      {[['Total',s.total,'📚','#e8c547'],['Wishlist',s.wishlist,'🔖','#fbbf24'],['Watching',s.watching,'▶️','#60a5fa'],['Watched',s.watched,'✅','#34d399'],['Avg Rating',s.avg?s.avg+'★':'—','⭐','#e8c547']].map(([l,v,i,c])=>(
        <div key={l} className="rounded-xl p-3 text-center" style={{background:'#161b26',border:'1px solid #1e2534'}}>
          <div style={{fontSize:'1.4rem'}}>{i}</div>
          <div className="font-display mt-1" style={{fontSize:'1.5rem',color:c,letterSpacing:'1px'}}>{v}</div>
          <div className="text-xs mt-0.5" style={{color:'#4a5568'}}>{l}</div>
        </div>
      ))}
    </div>
  );
}

function MyListPage() {
  const {bookmarks, loading, loadBookmarks} = useBookmarks();
  const [statusTab, setStatusTab] = useState('all');
  const [catTab, setCatTab] = useState('all');
  const [sort, setSort] = useState('newest');
  const [search, setSearch] = useState('');

  useEffect(()=>{ loadBookmarks(); },[loadBookmarks]);

  const counts = useMemo(()=>{
    const base = catTab!=='all' ? bookmarks.filter(b=>b.category===catTab) : bookmarks;
    return {all:base.length, wishlist:base.filter(b=>b.status==='wishlist').length, watching:base.filter(b=>b.status==='watching').length, watched:base.filter(b=>b.status==='watched').length};
  },[bookmarks,catTab]);

  const filtered = useMemo(()=>{
    let list=[...bookmarks];
    if(statusTab!=='all') list=list.filter(b=>b.status===statusTab);
    if(catTab!=='all') list=list.filter(b=>b.category===catTab);
    if(search.trim()) list=list.filter(b=>b.title.toLowerCase().includes(search.toLowerCase()));
    if(sort==='oldest') list.sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
    else if(sort==='title_asc') list.sort((a,b)=>a.title.localeCompare(b.title));
    else if(sort==='title_desc') list.sort((a,b)=>b.title.localeCompare(a.title));
    else if(sort==='rating_desc') list.sort((a,b)=>(b.rating||0)-(a.rating||0));
    else if(sort==='rating_asc') list.sort((a,b)=>(a.rating||0)-(b.rating||0));
    else list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    return list;
  },[bookmarks,statusTab,catTab,sort,search]);

  const EMPTY = {all:{i:'🎬',t:'Your list is empty',s:'Head to Discover and start adding shows!'},wishlist:{i:'🔖',t:'Wishlist is empty',s:'Add shows you want to watch.'},watching:{i:'▶️',t:'Not watching anything',s:'Mark a show as watching to see it here.'},watched:{i:'✅',t:'No watched shows',s:'Complete a show and mark it watched.'}};
  const em = EMPTY[statusTab]||EMPTY.all;

  return (
    <div className="max-w-7xl mx-auto px-4 py-10" style={{minHeight:'100vh'}}>
      <div className="mb-8">
        <div className="flex items-center gap-3 mb-2">
          <div className="h-px w-8" style={{background:'linear-gradient(to right,transparent,#e8c547)'}}/>
          <span className="text-xs tracking-widest uppercase" style={{color:'#e8c547'}}>Your Collection</span>
        </div>
        <h2 className="font-display" style={{fontSize:'clamp(3rem,8vw,5rem)',color:'#e2e8f0',letterSpacing:'4px',lineHeight:1}}>
          MY <span style={{color:'#e8c547'}}>LIST</span>
        </h2>
      </div>

      {bookmarks.length>0 && <StatsBar bookmarks={bookmarks}/>}

      {/* Category filter */}
      <div className="flex gap-2 mb-4 overflow-x-auto pb-1">
        {CAT_FILTERS.map(c=>(
          <button key={c.id} onClick={()=>setCatTab(c.id)}
            className="flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex-shrink-0"
            style={catTab===c.id?{background:'#e8c547',color:'#090b10',fontWeight:700}:{background:'#161b26',color:'#718096',border:'1px solid #1e2534'}}>
            {c.i} {c.l}
          </button>
        ))}
      </div>

      {/* Status tabs */}
      <div className="flex gap-1 mb-5 p-1 rounded-xl w-fit" style={{background:'#161b26'}}>
        {STATUS_TABS.map(t=>(
          <button key={t.id} onClick={()=>setStatusTab(t.id)}
            className="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium transition-all"
            style={statusTab===t.id?{background:'#e8c547',color:'#090b10',fontWeight:700}:{color:'#718096'}}>
            {t.i} {t.l}
            <span className="ml-1 text-xs px-1.5 py-0.5 rounded-full"
              style={{background:statusTab===t.id?'rgba(0,0,0,0.2)':'#1e2534',color:statusTab===t.id?'#090b10':'#4a5568',fontSize:'10px'}}>
              {counts[t.id]}
            </span>
          </button>
        ))}
      </div>

      {/* Search + Sort */}
      <div className="flex flex-col sm:flex-row gap-3 mb-6">
        <div className="relative flex-1">
          <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{color:'#4a5568'}}>🔍</span>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search your list…"
            className="w-full pl-9 pr-4 py-2.5 rounded-xl text-sm outline-none transition-all"
            style={{background:'#161b26',border:'1px solid #1e2534',color:'#e2e8f0'}}
            onFocus={e=>e.target.style.borderColor='#e8c547'} onBlur={e=>e.target.style.borderColor='#1e2534'}/>
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)} className="px-4 py-2.5 rounded-xl text-sm outline-none cursor-pointer" style={{background:'#161b26',border:'1px solid #1e2534',color:'#e2e8f0',minWidth:'160px'}}>
          {LIST_SORTS.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
        </select>
      </div>

      {/* Content */}
      {loading
        ? <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:'0.75rem'}}>
            {Array.from({length:6}).map((_,i)=><div key={i} className="h-28 rounded-xl shimmer"/>)}
          </div>
        : filtered.length===0
          ? <div className="flex flex-col items-center py-24 gap-4 fade-in">
              <span style={{fontSize:'5rem'}}>{em.i}</span>
              <p className="text-xl font-semibold" style={{color:'#e2e8f0'}}>{em.t}</p>
              <p className="text-sm text-center max-w-xs" style={{color:'#4a5568'}}>{em.s}</p>
            </div>
          : <>
              <p className="text-xs mb-4" style={{color:'#4a5568'}}>{filtered.length} show{filtered.length!==1?'s':''}</p>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(310px,1fr))',gap:'0.75rem'}}>
                {filtered.map(b=><BookmarkCard key={b._id||b.showId} bookmark={b}/>)}
              </div>
            </>}
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function AppInner() {
  const [page, setPage] = useState('discover');
  const {toast} = useBookmarks();
  return (
    <div style={{minHeight:'100vh',background:'#090b10'}}>
      <Navbar page={page} setPage={setPage}/>
      {page==='discover' ? <DiscoverPage/> : <MyListPage/>}
      <Toast toast={toast}/>
      <footer className="py-8 text-center" style={{borderTop:'1px solid #1e2534',marginTop:'4rem'}}>
        <span className="font-display text-2xl" style={{color:'#2d3748',letterSpacing:'4px'}}>MY<span style={{color:'#2d3748'}}>SHOWS</span></span>
        <p className="text-xs mt-1" style={{color:'#1e2534'}}>Track · Discover · Enjoy</p>
      </footer>
    </div>
  );
}

function App() {
  return (
    <BookmarkProvider>
      <AppInner/>
    </BookmarkProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
